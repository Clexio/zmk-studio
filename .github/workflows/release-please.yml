# 停用：缺少 GITHUB_TOKEN 权限导致每次 push 都失败；
# 版本由发布流程手动管理，不需要 release-please 自动开 PR。
on:
  workflow_dispatch:

permissions: {}

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.ZMK_STUDIO_RELEASE_TOKEN }}
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: prod
      - name: publish to prod branch
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git fetch origin main
          git pull --ff-only origin main
          git remote set-url origin "https://x-access-token:${{ secrets.ZMK_STUDIO_RELEASE_TOKEN }}@github.com/${{ github.repository }}.git"
          git push
