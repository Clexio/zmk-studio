name: Publish installers to OSS

on:
  workflow_run:
    workflows: ["Build Windows App", "Build macOS App", "Build Linux App"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oss2
        run: pip install --quiet oss2

      - name: Publish current build to OSS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
          OSS_BUCKET: keyplayer
          OSS_PREFIX: KeyPlayer/app
          FW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            win_run=$(gh run list --repo ${{ github.repository }} --workflow "Build Windows App" --status completed --limit 5 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId')
            mac_run=$(gh run list --repo ${{ github.repository }} --workflow "Build macOS App" --status completed --limit 5 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId')
            if [ -n "$win_run" ] && [ "$win_run" != "null" ]; then
              gh run download "$win_run" --repo ${{ github.repository }} -n zmk-studio-windows-installer -D app_windows
              python .github/scripts/publish_app.py windows app_windows
            fi
            if [ -n "$mac_run" ] && [ "$mac_run" != "null" ]; then
              gh run download "$mac_run" --repo ${{ github.repository }} -n zmk-studio-macos-installer -D app_macos
              python .github/scripts/publish_app.py macos app_macos
            fi
            linux_run=$(gh run list --repo ${{ github.repository }} --workflow "Build Linux App" --status completed --limit 5 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId')
            if [ -n "$linux_run" ] && [ "$linux_run" != "null" ]; then
              gh run download "$linux_run" --repo ${{ github.repository }} -n zmk-studio-linux-installer -D app_linux
              python .github/scripts/publish_app.py linux app_linux
            fi
          else
            case "${{ github.event.workflow_run.name }}" in
              "Build Windows App")
                gh run download "${{ github.event.workflow_run.id }}" --repo ${{ github.repository }} -n zmk-studio-windows-installer -D app_windows
                python .github/scripts/publish_app.py windows app_windows
                ;;
              "Build macOS App")
                gh run download "${{ github.event.workflow_run.id }}" --repo ${{ github.repository }} -n zmk-studio-macos-installer -D app_macos
                python .github/scripts/publish_app.py macos app_macos
                ;;
              "Build Linux App")
                gh run download "${{ github.event.workflow_run.id }}" --repo ${{ github.repository }} -n zmk-studio-linux-installer -D app_linux
                python .github/scripts/publish_app.py linux app_linux
                ;;
            esac
          fi
